[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metetl-bagrova-6305-v7"
version = "1.0.0"
description = "ETL pipeline for Met Museum artworks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Bagrova", email = "nbagrova498@gmail.com"}]

dependencies = [
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "aiohttp>=3.8.0",
    "aiofiles>=22.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.scripts]
metetl = "metetl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["metetl*"]

[tool.setuptools.package-data]
metetl = ["*.json"]